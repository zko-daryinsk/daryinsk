<!DOCTYPE html>
<html lang="ru" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Справочник Дарьинского Округа</title>
    <link rel="stylesheet" href="style.css?v=2026">
</head>
<body class="notranslate">
    <div class="sticky-header">
        <div class="header-top-line">
            <h1 id="siteTitle" class="main-title">...</h1>
            <div class="header-controls">
                <button id="btnInfo" class="circle-btn" type="button">ℹ️</button>
                <button id="themeToggle" class="circle-btn" type="button">🌙</button>
                <button id="langToggle" class="lang-btn" type="button">KZ</button>
            </div>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="..." autocomplete="off" inputmode="search">
            <button id="clearSearch" class="clear-btn" type="button" style="display: none;">✕</button>
        </div>
        <div class="filter-controls-row">
            <div class="village-select-wrapper">
                <select id="villageSelect" class="village-select"></select>
            </div>
            <button id="viewModeToggle" class="view-mode-btn" type="button">📱</button>
        </div>
        <div id="tabsContainer" class="tabs-container" style="display: flex;"></div>
        <div id="selectContainer" class="select-container" style="display: none;"></div>
        <div id="alphabetContainer" class="alphabet-container"></div>
    </div>
    <div id="contactsContainer" class="contacts-container"></div>
    <div class="floating-actions-bar">
        <button id="favTabBtn" class="action-bar-btn fav-bar-btn" type="button"><span>...</span></button>
        <button id="addContactBtn" class="action-bar-btn add-bar-btn" type="button"><span>...</span></button>
    </div>
    <div id="welcomeModal" class="modal-overlay" style="display: none;">
        <div class="modal-content welcome-card">
            <div class="welcome-header">
                <h2 id="welcomeModalTitle" class="welcome-main-title">...</h2>
                <div class="welcome-lang-row">
                    <button id="m-btn-ru" class="modal-lang-toggle" type="button">RU</button>
                    <button id="m-btn-kz" class="modal-lang-toggle" type="button">KZ</button>
                </div>
            </div>
            <div id="welcomeModalText" class="welcome-body-text"></div>
            <button id="btnWelcomeAction" class="btn-welcome-close" type="button">...</button>
        </div>
    </div>
    <div id="addModal" class="modal-overlay" style="display: none;">
        <div class="modal-content form-card">
            <div class="form-header">
                <h2 id="modalTitle">...</h2>
                <button id="closeModal" class="close-x-btn" type="button">✕</button>
            </div>
            <form id="contactForm" autocomplete="off">
                <select id="formCategorySelect" class="form-input"></select>
                <input type="text" id="formTitle" class="form-input" required placeholder="Название / Имя мастера *">
                <input type="tel" id="formPhone" class="form-input" required placeholder="Телефон (например: 7771234567) *">
                <input type="text" id="formName" class="form-input" placeholder="Имя контактного лица (необязательно)">
                <input type="text" id="formDesc" class="form-input" placeholder="Описание услуг / Описание товара">
                <input type="text" id="formAddress" class="form-input" placeholder="Адрес / Посёлок / Ориентир">
                <input type="text" id="formSchedule" class="form-input" placeholder="⌛ Время работы (например: 09:00 - 21:00)">
                <div class="form-wa-checkbox-row">
                    <input type="checkbox" id="formHasWa" checked>
                    <label id="lblHasWa" for="formHasWa">...</label>
                </div>
                <button id="submitContactForm" class="btn-form-submit" type="submit">...</button>
            </form>
        </div>
    </div>
    <script src="script.js?v=2081"></script>
</body>
</html>
