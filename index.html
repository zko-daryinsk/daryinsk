<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Справочник посёлков</title>
    <!-- Пинаем кэш стилей, чтобы убрать перекошенную карусель -->
    <link rel="stylesheet" href="style.css?v=9999">
</head>
<body>
    <header class="site-header">
        <div class="header-top">
            <h1 id="siteTitle" class="site-title">Справочник посёлков</h1>
            <div class="header-controls">
                <button id="themeToggle" class="icon-btn">🌙</button>
                <button id="langToggle" class="lang-btn">KZ</button>
            </div>
        </div>
        <div class="header-actions">
            <select id="villageSelect" class="village-select"></select>
            <button id="btnInfo" class="icon-btn">ℹ️</button>
        </div>
        <input type="text" id="searchInput" placeholder="Поиск...">
        <button id="clearSearch" style="display:none;">&times;</button>
    </header>

    <main class="content-area">
        <!-- Контейнер для вкладок категорий сверху -->
        <nav id="labsContainer" class="labs-scroll-container"></nav>
        <!-- Контейнер для букв алфавита -->
        <div id="alphabetContainer" class="alphabet-container"></div>
        <!-- Контейнер для карточек мастеров строго внизу -->
        <div id="contactsContainer" class="contacts-grid"></div>
    </main>

    <!-- КНОПКИ В ПОДВАЛЕ САЙТА -->
    <footer class="site-footer" style="margin-top: 20px; display: flex; gap: 10px;">
        <button id="favTabBtn" class="footer-btn">⭐ Избранное</button>
        <button id="addContactBtn" class="footer-btn">➕ Добавить</button>
    </footer>

    <!-- ОКНО ПРИВЕТСТВИЯ -->
    <div id="welcomeModal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <div class="modal-lang-toggle">
                <button id="m-btn-ru" class="modal-lang-btn active">RU</button>
                <button id="m-btn-kz" class="modal-lang-btn">KZ</button>
            </div>
            <h2 id="welcomeModalTitle" class="modal-title">Как пользоваться справочником?</h2>
            <div id="welcomeModalText" class="modal-body-content"></div>
            <button id="btnWelcomeAction" class="modal-action-btn">Понятно</button>
        </div>
    </div>

    <!-- ОКНО ДОБАВЛЕНИЯ -->
    <div id="addModal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h3 class="modal-title">Добавить контакт</h3>
            <button id="closeModal" class="close-modal-btn">&times;</button>
            <form id="contactForm" class="modal-form">
                <input type="text" id="formName" placeholder="Ваше имя или услуга" required>
                <input type="tel" id="formPhone" placeholder="Номер телефона" required>
                <button type="submit" class="modal-action-btn">Отправить</button>
            </form>
        </div>
    </div>

    <!-- АВТОМАТИЧЕСКИЙ БЕССРОЧНЫЙ СБРОС КЭША СКРИПТА ПО СЕКУНДАМ -->
    <script>
        document.write('<script src="script.js?v=' + Date.now() + '"><\\/script>');
    </script>
</body>
</html>
