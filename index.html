<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Справочник</title>
    <link rel="stylesheet" href="style.css?v=2095">
</head>
<body>
    <header class="site-header">
        <div class="header-top">
            <div class="logo-area">
                <span class="flag-icon">🇰🇿</span>
                <h1 id="siteTitle" class="site-title">Справочник</h1>
            </div>
            <div class="header-controls">
                <button id="themeToggle" class="icon-btn" title="Смена темы">🌙</button>
                <button id="langToggle" class="lang-btn">KZ</button>
            </div>
        </div>
        <div class="header-actions">
            <div class="select-wrapper">
                <select id="villageSelect" class="village-select"></select>
            </div>
            <button id="btnInfo" class="icon-btn info-btn" title="Инструкция">ℹ️</button>
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Поиск..." autocomplete="off">
            <button id="clearSearch" class="clear-btn">&times;</button>
        </div>
    </header>

    <main class="content-area">
        <nav id="labsContainer" class="labs-scroll-container"></nav>
        <div id="alphabetContainer" class="alphabet-container"></div>
        <div id="contactsContainer" class="contacts-grid"></div>
    </main>

    <footer class="site-footer">
        <button id="favTabBtn" class="footer-btn">⭐ Избранные</button>
        <button id="addContactBtn" class="footer-btn">➕ Добавить</button>
    </footer>

    <!-- ОКНО ПРИВЕТСТВИЯ С ОДНИМ ЕДИНЫМ КАРМАШКОМ ДЛЯ ТЕКСТА JSON -->
    <div id="welcomeModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header-block">
                <div class="modal-lang-toggle">
                    <button id="m-btn-ru" class="modal-lang-btn active">RU</button>
                    <button id="m-btn-kz" class="modal-lang-btn">KZ</button>
                </div>
                <h2 id="welcomeModalTitle" class="modal-title">Как пользоваться справочником?</h2>
            </div>
            <div id="welcomeModalText" class="modal-body-content"></div>
            <button id="btnWelcomeAction" class="modal-action-btn">Понятно</button>
        </div>
    </div>

    <!-- ОКНО ДОБАВЛЕНИЯ КОНТАКТА -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-card-header">
                <h3 class="modal-title">Добавить контакт</h3>
                <button id="closeModal" class="close-modal-btn">&times;</button>
            </div>
            <form id="contactForm" class="modal-form">
                <input type="text" id="formName" placeholder="Ваше имя или услуга" required>
                <input type="tel" id="formPhone" placeholder="Номер телефона (например: 7705...)" required>
                <button type="submit" class="modal-action-btn">Отправить заявку</button>
            </form>
        </div>
    </div>

    <!-- ВСТРОЕННЫЙ АВТОСБРОС КЭША ПО СЕКУНДАМ -->
    <script>
        document.write('<script src="script.js?v=' + Date.now() + '"><\\/script>');
    </script>
</body>
</html>
